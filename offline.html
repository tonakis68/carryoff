<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarryOff is offline</title>
<style>
:root{color-scheme:light dark;--bg:#f1f4f8;--ink:#0f1f2e;--ink2:#4a5b6b;--accent:#1f4fd8}

body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px}
main{max-width:360px}img{width:72px;height:72px;border-radius:18px}h1{font-size:22px;margin:16px 0 8px}p{color:var(--ink2);margin:0 0 20px}
